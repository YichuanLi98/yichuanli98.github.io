<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Yichuan Li · 作品管理</title>
  </head>
  <body>
    <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              window.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
