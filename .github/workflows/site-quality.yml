name: Site quality

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate structured content
        run: ruby scripts/validate_content.rb --site _data/site.yml --works _works

      - name: Check media metadata
        run: python3 scripts/sanitize_media.py --check assets/images/works

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Run browser tests
        run: npm run test:browser
